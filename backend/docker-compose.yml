services:
  app:
    image: s293687/se2-group-12-mountain-hut:latest
    container_name: mountain-hut
    restart: unless-stopped
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      FRONTEND_ORIGIN: http://localhost:3000
      DB_PATH: /app/data/mountain-hut.sqlite
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SERVE_FRONTEND: "true"
    volumes:
      - backend_data:/app/data
    ports:
      - "3000:3000"
    depends_on:
      - mailpit

  mailpit:
    image: axllent/mailpit
    container_name: mailpit
    restart: unless-stopped
    volumes:
      - ./data:/data
    ports:
      - 8025:8025
      - 1025:1025
    environment:
      MP_MAX_MESSAGES: 5000
      MP_DATABASE: /data/mailpit.db
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1

volumes:
  backend_data: